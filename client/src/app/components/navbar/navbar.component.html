            aria-label="Toggle navigation">
      <span class="oi oi-menu"></span> Menu
    </button>

    <div class="collapse navbar-collapse" 
         [class.show]="!isMenuCollapsed" 
         id="ftco-nav">

      <ul class="navbar-nav ml-auto">
        
        <li class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <a routerLink="/" class="nav-link" (click)="closeAll()">Home</a>

        <li class="nav-item" routerLinkActive="active">
            <a routerLink="/menu" class="nav-link" (click)="closeAll()">Menu</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
            <a routerLink="/services" class="nav-link" (click)="closeAll()">Services</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
            <a routerLink="/blog" class="nav-link" (click)="closeAll()">Blog</a>
        </li>
        <li class="nav-item" routerLinkActive="active">
            <a routerLink="/about" class="nav-link" (click)="closeAll()">About</a>
        </li>
        
        <li class="nav-item dropdown" [class.show]="isShopOpen">
          <a class="nav-link dropdown-toggle" 
             id="dropdown04" 
             (click)="toggleShop()" 
             style="cursor: pointer;">Shop</a>
             
          <div class="dropdown-menu" 
               [class.show]="isShopOpen" 
               aria-labelledby="dropdown04">
            <a class="dropdown-item" routerLink="/shop" (click)="closeAll()">Shop</a>
            <a class="dropdown-item" routerLink="/shop/product/1" (click)="closeAll()">Single Product</a>

            <small>{{ totalItem }}</small>
        </span>
