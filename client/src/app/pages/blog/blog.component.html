<section class="home-slider owl-carousel">
    <div class="slider-item" style="background-image: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80');" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="row slider-text justify-content-center align-items-center">
                <div class="col-md-7 col-sm-12 text-center ftco-animate">
                    <h1 class="mb-3 mt-5 bread">Read our Blog</h1>
                    <p class="breadcrumbs"><span class="mr-2"><a routerLink="/blog">Blog</a></span> <span><a routerLink="/about">About</a></span></p>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="ftco-section" style="padding-top: 5em;background-color: black;">
    <div class="container">
        <div class="row d-flex">
            
            <div class="col-md-4 d-flex ftco-animate" *ngFor="let post of blogPosts">
                <div class="blog-entry align-self-stretch">
                    
                    <a href="blog-single.html" class="block-20" [style.backgroundImage]="'url(' + post.image + ')'">
                    </a>
                    
                    <div class="text py-4 d-block">
                        <div class="meta">
                            <div><a href="#">{{ post.date }}</a></div>
                            <div><a href="#">{{ post.author }}</a></div>
                            <div><a href="#" class="meta-chat"><span class="icon-chat"></span> {{ post.comments }}</a></div>
                        </div>
                        <h3 class="heading mt-2"><a href="#">{{ post.title }}</a></h3>
                        <p>{{ post.description }}</p>
                    </div>

                </div>
            </div>

        </div>

 
    </div>
</section>
